name: Build Mod JAR (1.21.4)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-1-21-4:
    name: Build jar for 1.21.4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle --no-daemon clean build

      - name: Prepare versioned jar
        run: |
          mkdir -p dist
          for jar in build/libs/*.jar; do
            cp "$jar" "dist/hellcit-mc1.21.4.jar"
          done

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: hell-cit-mod-jars-1.21.4
          path: dist/*.jar
          if-no-files-found: error
