name: Build Mod JAR (1.21.x Artifacts)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-core:
    name: Build core jar (1.21.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle --no-daemon clean build

      - name: Upload base jar
        uses: actions/upload-artifact@v4
        with:
          name: hell-cit-mod-jars-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error

  publish-versioned-artifacts:
    name: Publish artifact ${{ matrix.mc }}
    runs-on: ubuntu-latest
    needs: build-core
    strategy:
      fail-fast: false
      matrix:
        mc: ["1.21", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11"]

    steps:
      - name: Download base jar
        uses: actions/download-artifact@v4
        with:
          name: hell-cit-mod-jars-1.21.1
          path: base

      - name: Rename for target version
        run: |
          mkdir -p dist
          for jar in base/*.jar; do
            base_name=$(basename "$jar" .jar)
            cp "$jar" "dist/${base_name}+mc${{ matrix.mc }}.jar"
          done

      - name: Upload versioned jar
        uses: actions/upload-artifact@v4
        with:
          name: hell-cit-mod-jars-${{ matrix.mc }}
          path: dist/*.jar
          if-no-files-found: error
