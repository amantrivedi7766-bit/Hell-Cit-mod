name: Build Mod JAR (1.21.x Matrix)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: 1.21.1
            yarn: 1.21.1+build.3
            fabric_api: 0.115.0+1.21.1
          - mc: 1.21.2
            yarn: 1.21.2+build.1
            fabric_api: 0.106.1+1.21.2
          - mc: 1.21.3
            yarn: 1.21.3+build.2
            fabric_api: 0.114.0+1.21.3
          - mc: 1.21.4
            yarn: 1.21.4+build.1
            fabric_api: 0.117.5+1.21.4
          - mc: 1.21.5
            yarn: 1.21.5+build.1
            fabric_api: 0.118.4+1.21.5
          - mc: 1.21.6
            yarn: 1.21.6+build.1
            fabric_api: 0.120.0+1.21.6
          - mc: 1.21.7
            yarn: 1.21.7+build.1
            fabric_api: 0.121.0+1.21.7
          - mc: 1.21.8
            yarn: 1.21.8+build.1
            fabric_api: 0.123.0+1.21.8
          - mc: 1.21.9
            yarn: 1.21.9+build.1
            fabric_api: 0.124.0+1.21.9
          - mc: 1.21.10
            yarn: 1.21.10+build.1
            fabric_api: 0.126.0+1.21.10
          - mc: 1.21.11
            yarn: 1.21.11+build.1
            fabric_api: 0.127.0+1.21.11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for ${{ matrix.mc }}
        run: |
          gradle --no-daemon clean build \
            -PmcVersion=${{ matrix.mc }} \
            -PyarnVersion=${{ matrix.yarn }} \
            -PfabricApiVersion=${{ matrix.fabric_api }}

      - name: Prepare renamed jars
        run: |
          mkdir -p dist
          for jar in build/libs/*.jar; do
            base=$(basename "$jar" .jar)
            cp "$jar" "dist/${base}+mc${{ matrix.mc }}.jar"
          done

      - name: Upload JAR artifacts (${{ matrix.mc }})
        uses: actions/upload-artifact@v4
        with:
          name: hell-cit-mod-jars-${{ matrix.mc }}
          path: dist/*.jar
          if-no-files-found: error
