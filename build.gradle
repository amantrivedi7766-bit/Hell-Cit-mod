plugins {
    id 'fabric-loom' version '1.8.13'
    id 'maven-publish'
}

group = 'com.hellcitmod'
version = '0.2.0'

def mcVersion = findProperty('mcVersion') ?: '1.21.1'
def yarnVersion = findProperty('yarnVersion') ?: '1.21.1+build.3'
def fabricApiVersion = findProperty('fabricApiVersion') ?: '0.115.0+1.21.1'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings "net.fabricmc:yarn:${yarnVersion}:v2"
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modCompileOnly 'com.terraformersmc:modmenu:11.0.3'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}
